name: Native speech verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm test
      - name: Prepare and warm real native speech
        run: npm run setup:speech
      - name: Prepare verified managed media encoder
        run: npm run setup:media
      - name: Verify cache-only native speech on Windows
        if: runner.os == 'Windows'
        run: npm run test:native
      - name: Verify native Linux with external networking disabled
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net -- bash -c 'ip link set lo up; exec "$1" tests/native-smoke.mjs' _ "$(command -v node)"
      - name: Verify complete native audio on Windows without downloads
        if: runner.os == 'Windows'
        run: npm run test:audio-native
      - name: Verify complete native audio on Linux without external networking
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net -- bash -c 'ip link set lo up; exec "$1" tests/full-audio-native.mjs' _ "$(command -v node)"
      - uses: actions/upload-artifact@v4
        with:
          name: native-offline-example-${{ runner.os }}
          path: |
            artifacts/native-offline-lesson.html
            artifacts/native-speech.wav
            artifacts/native-full-audio-lesson.html
            artifacts/native-full-audio-summary.json
          retention-days: 7
