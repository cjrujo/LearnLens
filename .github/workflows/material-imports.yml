name: Real material imports
on:
  workflow_dispatch:
    inputs:
      boundary_only:
        description: Investigate the pinned EJS boundary with synthetic code only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  material-imports:
    if: ${{ inputs.boundary_only != true }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yt-dlp/yt-dlp
          ref: f264a6cbd1f630894da0f368df00f8aae50140e0
          path: artifacts/pinned-yt-dlp
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        id: install
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm test
      - run: npm run setup:media
        id: media
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run setup:youtube
        id: youtube
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Real Windows media from cache
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.media.outcome == 'success' }}
        run: node --test tests/native-media.test.mjs tests/material-import.test.mjs tests/video-clips.test.mjs tests/video-timing.test.mjs tests/video-store-native.test.mjs tests/audio-encode.test.mjs
        env:
          LEARNLENS_MEDIA_OFFLINE: '1'
          LEARNLENS_MEDIA_INTEGRATION: '1'
      - name: Real Linux media without external networking
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.media.outcome == 'success' }}
        shell: bash
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; export LEARNLENS_MEDIA_OFFLINE=1 LEARNLENS_MEDIA_INTEGRATION=1; exec "$1" --test tests/native-media.test.mjs tests/material-import.test.mjs tests/video-clips.test.mjs tests/video-timing.test.mjs tests/video-store-native.test.mjs tests/audio-encode.test.mjs' _ "$(command -v node)"
      - name: Pinned helper runtime and permissions
        id: helper
        if: ${{ !cancelled() && steps.youtube.outcome == 'success' }}
        run: node --test tests/youtube-tools.test.mjs
        env:
          LEARNLENS_YOUTUBE_INTEGRATION: '1'
          LEARNLENS_YOUTUBE_OFFLINE: '1'
      - name: Pinned EJS execution boundary (synthetic code only)
        id: boundary
        if: ${{ !cancelled() && steps.youtube.outcome == 'success' }}
        run: node tests/youtube-boundary.mjs
        env:
          LEARNLENS_YOUTUBE_BOUNDARY_TEST: '1'
          LEARNLENS_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          LEARNLENS_TEST_UPSTREAM: ${{ github.workspace }}/artifacts/pinned-yt-dlp
      - name: Public DNS and full source acquisition (no AI)
        if: ${{ !cancelled() && steps.media.outcome == 'success' }}
        run: node tests/url-public-smoke.mjs
        env:
          LEARNLENS_PUBLIC_URL_TEST: '1'
          LEARNLENS_MEDIA_OFFLINE: '1'
      - name: Best-effort public YouTube trial (no login or AI)
        if: ${{ !cancelled() && steps.media.outcome == 'success' && steps.helper.outcome == 'success' && steps.boundary.outcome == 'success' }}
        continue-on-error: true
        run: node tests/url-public-smoke.mjs --youtube
        env:
          LEARNLENS_PUBLIC_URL_TEST: '1'
          LEARNLENS_MEDIA_OFFLINE: '1'
          LEARNLENS_YOUTUBE_OFFLINE: '1'
      - name: Retain explicit public-source results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-source-results-${{ runner.os }}
          path: |
            artifacts/url-public-smoke-*.json
            artifacts/youtube-public-smoke-*.json
            artifacts/youtube-boundary-*/
          if-no-files-found: warn
          retention-days: 7
  boundary-investigation:
    if: ${{ inputs.boundary_only == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yt-dlp/yt-dlp
          ref: f264a6cbd1f630894da0f368df00f8aae50140e0
          path: artifacts/pinned-yt-dlp
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run setup:youtube
      - name: Synthetic pinned EJS boundary investigation (not the release gate)
        run: node tests/youtube-boundary.mjs
        env:
          LEARNLENS_YOUTUBE_BOUNDARY_TEST: '1'
          LEARNLENS_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          LEARNLENS_TEST_UPSTREAM: ${{ github.workspace }}/artifacts/pinned-yt-dlp
      - name: Native runtime storage and deadline regression
        if: ${{ !cancelled() }}
        run: node --test --test-name-pattern="pinned Deno runtime-compiled" tests/youtube-tools.test.mjs
        env:
          LEARNLENS_YOUTUBE_INTEGRATION: '1'
          LEARNLENS_YOUTUBE_OFFLINE: '1'
      - name: Native runtime from an owned OS-temporary directory
        if: ${{ !cancelled() }}
        run: node --test --test-name-pattern="pinned Deno runtime-compiled" tests/youtube-tools.test.mjs
        env:
          LEARNLENS_YOUTUBE_INTEGRATION: '1'
          LEARNLENS_YOUTUBE_OFFLINE: '1'
          LEARNLENS_TEST_RUNTIME_TEMP: '1'
      - name: Retain synthetic boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-boundary-${{ runner.os }}
          path: artifacts/youtube-boundary-*/
          if-no-files-found: warn
          retention-days: 7
