name: Real material imports
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  material-imports:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm test
      - run: npm run setup:media
      - run: npm run setup:youtube
      - name: Real Windows media from cache
        if: runner.os == 'Windows'
        run: node --test tests/native-media.test.mjs tests/material-import.test.mjs tests/video-clips.test.mjs tests/video-timing.test.mjs tests/video-store-native.test.mjs tests/audio-encode.test.mjs tests/youtube-tools.test.mjs
        env:
          LEARNLENS_MEDIA_OFFLINE: '1'
          LEARNLENS_MEDIA_INTEGRATION: '1'
      - name: Real Linux media without external networking
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; export LEARNLENS_MEDIA_OFFLINE=1 LEARNLENS_MEDIA_INTEGRATION=1; exec "$1" --test tests/native-media.test.mjs tests/material-import.test.mjs tests/video-clips.test.mjs tests/video-timing.test.mjs tests/video-store-native.test.mjs tests/audio-encode.test.mjs tests/youtube-tools.test.mjs' _ "$(command -v node)"
      - name: Public DNS and full source acquisition (no AI)
        run: node tests/url-public-smoke.mjs
        env:
          LEARNLENS_PUBLIC_URL_TEST: '1'
          LEARNLENS_MEDIA_OFFLINE: '1'
      - name: Best-effort public YouTube trial (no login or AI)
        continue-on-error: true
        run: node tests/url-public-smoke.mjs --youtube
        env:
          LEARNLENS_PUBLIC_URL_TEST: '1'
          LEARNLENS_MEDIA_OFFLINE: '1'
          LEARNLENS_YOUTUBE_OFFLINE: '1'
      - name: Retain explicit public-source results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-source-results-${{ runner.os }}
          path: |
            artifacts/url-public-smoke-*.json
            artifacts/youtube-public-smoke-*.json
          if-no-files-found: warn
          retention-days: 7
